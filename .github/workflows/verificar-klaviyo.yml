# Prueba temporal (no suscribe a nadie): manda un correo inválido para comprobar
# que Klaviyo reconoce la llave pública y la lista.
name: Verificar Klaviyo
on:
  push:
    branches: [claude/summaproducts-footer-test-0ebqm8]
    paths: [.github/workflows/verificar-klaviyo.yml]
jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for cid in H6mKTg XXXXXX; do
            echo "== company_id $cid"
            curl -sS -X POST "https://a.klaviyo.com/client/subscriptions?company_id=$cid" \
              -H 'Content-Type: application/vnd.api+json' -H 'revision: 2024-10-15' -H 'Origin: https://inserto.specialfitsocks.com' \
              -d '{"data":{"type":"subscription","attributes":{"profile":{"data":{"type":"profile","attributes":{"email":"no-es-un-correo"}}}},"relationships":{"list":{"data":{"type":"list","id":"WthbWD"}}}}}' \
              -w "\nHTTP %{http_code}\n" | head -c 500; echo
          done
