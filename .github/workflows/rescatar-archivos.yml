# Copia una sola vez al repositorio los archivos (imágenes, videos) que viven
# en el almacenamiento externo del sitio, para no perderlos.
# Archivos de más de 95 MB: el original se guarda en el Release "respaldo-archivos"
# y al repositorio entra una versión comprimida para la página.
name: Rescatar archivos del sitio

on:
  workflow_dispatch:
  push:
    branches: [claude/summaproducts-footer-test-0ebqm8]
    paths: [.github/workflows/rescatar-archivos.yml]

permissions:
  contents: write

jobs:
  rescatar:
    runs-on: ubuntu-latest
    env:
      HOST: https://seed-to-reveal.lovable.app
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Descargar archivos
        run: |
          set -u
          fail=0
          LIMIT=$((95*1024*1024))
          for f in src/assets/*.asset.json; do
            url=$(jq -r .url "$f"); name=$(jq -r .original_filename "$f")
            dest="public${url}"
            [ -s "$dest" ] && continue
            mkdir -p "$(dirname "$dest")"
            if ! curl -fsSL --retry 3 -o "$dest" "${HOST}${url}"; then
              echo "ERR $url"; rm -f "$dest"; fail=1; continue
            fi
            size=$(stat -c %s "$dest")
            echo "OK  $url ($size bytes)"
            if [ "$size" -gt "$LIMIT" ]; then
              gh release view respaldo-archivos >/dev/null 2>&1 || \
                gh release create respaldo-archivos --title "Respaldo de archivos originales" \
                  --notes "Originales de más de 95 MB que no caben en el repositorio. La página usa una versión comprimida." --target "$GITHUB_SHA"
              cp "$dest" "/tmp/$name"
              gh release upload respaldo-archivos "/tmp/$name" --clobber
              echo "Original respaldado en el Release: $name"
              which ffmpeg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
              for crf in 28 32 36; do
                ffmpeg -y -loglevel error -i "/tmp/$name" -vf "scale='min(1280,iw)':-2" -c:v libx264 -preset medium -crf $crf \
                  -c:a aac -b:a 96k -movflags +faststart "/tmp/c_$name"
                [ "$(stat -c %s "/tmp/c_$name")" -lt "$LIMIT" ] && break
              done
              mv "/tmp/c_$name" "$dest"
              echo "Comprimido: $(stat -c %s "$dest") bytes"
            fi
          done
          exit $fail
      - name: Guardar en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/__l5e
          git diff --cached --quiet && exit 0
          git commit -m "Rescata al repositorio los archivos del sitio"
          git push
