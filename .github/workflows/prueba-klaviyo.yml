# Prueba temporal: registra un correo de prueba en la lista del inserto, igual
# que lo hace el formulario de la página, y muestra la respuesta de Klaviyo.
name: Prueba Klaviyo
on:
  push:
    branches: [claude/amazing-cori-pfmk33]
    paths: [.github/workflows/prueba-klaviyo.yml]
jobs:
  prueba:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sS -X POST "https://a.klaviyo.com/client/subscriptions?company_id=H6mKTg" \
            -H 'Content-Type: application/vnd.api+json' -H 'Accept: application/vnd.api+json' \
            -H 'revision: 2024-10-15' -H 'Origin: https://inserto.specialfitsocks.com' \
            -d '{"data":{"type":"subscription","attributes":{"profile":{"data":{"type":"profile","attributes":{"email":"ventas+prueba-inserto@instanutra360.com","first_name":"Prueba Inserto","subscriptions":{"email":{"marketing":{"consent":"SUBSCRIBED"}}},"properties":{"tags":["flor-de-nube","papel-nube","mexico"],"papel_semilla":"nube","origen":"plantita"}}}}},"relationships":{"list":{"data":{"type":"list","id":"WthbWD"}}}}}' \
            -w "\nHTTP %{http_code}\n"
      - run: |
          for u in https://inserto.specialfitsocks.com/ https://ventas231.github.io/inserto-semilla/; do
            echo "== $u"; curl -sS -L -o p.html -w "HTTP %{http_code} -> %{url_effective}\n" "$u" || true
            for js in $(grep -o 'src="[^"]*\.js"' p.html | sed 's/src="//;s/"//'); do
              base=$(echo "$u" | sed 's#\(https://[^/]*\).*#\1#'); curl -sS "$base$js" | grep -o 'H6mKTg\|WthbWD' | sort -u
            done
          done
